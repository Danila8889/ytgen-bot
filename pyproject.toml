[project]
name = "ytgen-bot"
version = "0.1.0"
description = "Stateless Telegram front end (checkout + referral) over the youtubegen-saas-wrapper /v1/bot API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "alembic>=1.14,<2",
    "asyncpg>=0.30",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0.36,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pyyaml>=6.0.3",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ytgen_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

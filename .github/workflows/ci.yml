name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test
    # CI runs exclusively on the self-hosted runner (no GitHub-hosted runner is used anywhere in this repo), the
    # same model as the sibling repos. There is no `pull_request` trigger: work lands on `main` directly, so a
    # push (or a manual dispatch) is the only way a job reaches the runner.
    #
    # Two jobs, one runner, no deadlock: (1) a runner executes one job at a time and `deploy` `needs: test`, so
    # within a run the two never compete, and nothing waits for something that waits for it; (2) only `deploy`
    # has a concurrency group (cancel-in-progress: false), so a queued deploy never blocks a test; (3) a hard
    # `timeout-minutes` stops a hung test from holding the runner forever.
    #
    # Workspace isolation: the runner's workspace root is the production checkout that `deploy` reuses
    # (`clean: false`, rendered `.env`, `git rev-parse HEAD` = the deployed commit used for rollback). The test
    # checkout therefore goes into its own subdirectory, so it can neither move HEAD nor `git clean` the `.env`.
    runs-on: [self-hosted, ytgen-bot-vps]
    timeout-minutes: 15
    # Everything uv creates stays inside .ci-test-src. Do NOT pass `python-version` to setup-uv: it then runs
    # `uv venv` and "activates" a `.venv` at the WORKSPACE ROOT (the production checkout), which pollutes it and
    # makes every run after the first fail ("Activating python venv..." -> exit 2). The interpreter is chosen
    # with UV_PYTHON instead and the project environment is pinned inside the test directory.
    env:
      UV_PYTHON: "3.12"
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.ci-test-src/.venv
    # The suite needs no secrets and no outbound network: the wrapper is faked with httpx.MockTransport, Telegram with a
    # recording aiogram session and the LLM with recorded replies (tests/conftest.py fails any real outbound
    # connection). It DOES start a throw-away `postgres:16-alpine` container (tests/pg.py): published on 127.0.0.1 with a
    # docker-chosen random port, never a host port the VPS already uses, removed when the run ends - light and isolated.
    steps:
      - name: Checkout (isolated from the deploy workspace)
        uses: actions/checkout@v4
        with:
          path: .ci-test-src

      - name: Install uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
          activate-environment: false

      - name: Install project + dev dependencies
        working-directory: .ci-test-src
        run: uv sync --frozen

      - name: Lint (ruff, version pinned in uv.lock, default rule set)
        working-directory: .ci-test-src
        run: uv run ruff check

      - name: Run tests
        working-directory: .ci-test-src
        run: uv run pytest -q

  deploy:
    name: Deploy to production
    # Deploy is never automatic: workflow_dispatch only (Actions tab or `gh workflow run ci.yml --ref main`).
    if: github.event_name == 'workflow_dispatch'
    needs: test
    # The self-hosted runner registered for this repo on the VPS (see README "Deploy").
    runs-on: [self-hosted, ytgen-bot-vps]
    timeout-minutes: 20
    concurrency:
      group: ytgen-bot-production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    # GitHub exposes a secret to scripts only through a literal `secrets.NAME` reference in this YAML, so each
    # is mapped once here and scripts/render_env.sh reads it from the environment (deploy and rollback paths
    # call the same script).
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      BOT_SERVICE_API_KEY: ${{ secrets.BOT_SERVICE_API_KEY }}
      BOT_DB_PASSWORD: ${{ secrets.BOT_DB_PASSWORD }}
      KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
      MANAGER_CHAT_ID: ${{ secrets.MANAGER_CHAT_ID }}

    steps:
      - name: Capture currently-deployed commit
        id: prev
        run: |
          if [ -d .git ]; then
            prev_sha=$(git rev-parse HEAD)
            echo "Currently deployed: $prev_sha"
          else
            prev_sha=""
            echo "No prior deployment in this directory - first deploy, nothing to roll back to."
          fi
          echo "prev_sha=$prev_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout target SHA
        uses: actions/checkout@v4
        with:
          clean: false

      # Fails the whole deploy, naming the missing secret / empty value, BEFORE anything is touched.
      - name: Render .env from two layers
        run: ./scripts/render_env.sh

      - name: Deploy (docker compose up -d --build)
        id: deploy
        continue-on-error: true
        run: docker compose up -d --build

      - name: Post-deploy check (container healthy + getMe/wrapper self-check)
        id: healthcheck
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        run: ./scripts/post_deploy_check.sh

      - name: Roll back on deploy/health check failure
        if: always() && !cancelled() && (steps.deploy.outcome == 'failure' || steps.healthcheck.outcome == 'failure')
        run: |
          set -euo pipefail
          if [ "${{ steps.deploy.outcome }}" = "failure" ]; then
            reason="Deploy"
          else
            reason="Post-deploy check"
          fi
          prev_sha="${{ steps.prev.outputs.prev_sha }}"
          if [ -z "$prev_sha" ]; then
            echo "::error::${reason} failed for ${{ github.sha }} and there is no prior deployment to roll back to (first deploy); stopping the broken bot."
            docker compose down || true
            exit 1
          fi
          if [ "$prev_sha" = "${{ github.sha }}" ]; then
            echo "::warning::${reason} failed for ${{ github.sha }}; this is the same commit already deployed (no older commit to roll back to) - retrying the build once."
          else
            echo "::warning::${reason} failed for ${{ github.sha }}; rolling back to $prev_sha"
          fi
          git checkout "$prev_sha"
          # .env is gitignored: re-render it from the OLD commit's own .env.production, now in the working tree.
          ./scripts/render_env.sh
          docker compose up -d --build
          if ! ./scripts/post_deploy_check.sh; then
            echo "::error::Rollback to $prev_sha also failed its post-deploy check"
            exit 1
          fi
          echo "::error::Deploy of ${{ github.sha }} failed; rolled back to $prev_sha"
          exit 1

      - name: Deploy summary
        if: success()
        run: |
          echo "Deployed SHA: ${{ github.sha }}" | tee -a "$GITHUB_STEP_SUMMARY"
